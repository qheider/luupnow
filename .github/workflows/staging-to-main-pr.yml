name: Create PR from staging to main

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: staging-to-main-pr
  cancel-in-progress: false

jobs:
  create-or-update-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create PR if none is open
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = "staging";
            const base = "main";

            const { data: openPulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              base
            });
            const repoFullName = `${owner}/${repo}`.toLowerCase();
            const existing = openPulls.filter((pr) =>
              pr.head.ref === head &&
              pr.head.repo &&
              pr.head.repo.full_name &&
              pr.head.repo.full_name.toLowerCase() === repoFullName
            );

            if (existing.length > 0) {
              core.info(`Open PR already exists: #${existing[0].number}`);
              return;
            }

            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: `${base}...${head}`
            });

            if (comparison.ahead_by <= 0) {
              core.info(`No commits to merge from ${head} into ${base}; skipping PR creation.`);
              return;
            }

            try {
              const { data: pr } = await github.rest.pulls.create({
                owner,
                repo,
                title: "Sync staging into main",
                head,
                base,
                body: "Auto-created after new commits were pushed to `staging`."
              });

              core.info(`Created PR #${pr.number}`);
            } catch (error) {
              if (error.status === 403 && error.response?.data?.message?.includes("not permitted to create or approve pull requests")) {
                core.warning("Repository settings currently prevent GitHub Actions from creating PRs. Skipping without failing the workflow.");
                return;
              }
              throw error;
            }
