name: Create PR from staging to main

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: staging-to-main-pr
  cancel-in-progress: false

jobs:
  create-or-update-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create PR if none is open
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = "staging";
            const base = "main";

            const { data: existing } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: `${owner}:${head}`,
              base
            });

            if (existing.length > 0) {
              core.info(`Open PR already exists: #${existing[0].number}`);
              return;
            }

            const { data: pr } = await github.rest.pulls.create({
              owner,
              repo,
              title: "Sync staging into main",
              head,
              base,
              body: "Auto-created after new commits were pushed to `staging`."
            });

            core.info(`Created PR #${pr.number}`);
