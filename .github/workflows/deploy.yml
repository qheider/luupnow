name: Deploy to GoDaddy

# Every push to main, including a merged PR, deploys the static site
# directly to the GoDaddy public_html directory over FTPS.

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: deploy-godaddy
  cancel-in-progress: false

jobs:
  ftp-deploy:
    name: FTPS sync to public_html
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync files to GoDaddy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          protocol: ftps
          port: 21

          local-dir: ./
          server-dir: ./

          dangerous-clean-slate: false

          exclude: |
            .git*
            .git/**
            .github/**
            node_modules/**
            **/.DS_Store
            README.md
            README-UPLOAD.txt
            cgi-bin
            cgi-bin/**
            llms.txt
            .env
            .env.local
            9fet6vb4tbm9g9sc4lm9bou29tb133.html